<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Halloween Invitation — Finley, Olivia & Brandon</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 30%,#453626 0%,#1c211c 58%,#10130f 100%);color:#f0dfbd;font-family:Georgia,serif}main{max-width:480px;margin:auto;text-align:center;padding:42px 14px 80px}.eyebrow{font-size:11px;letter-spacing:3px;color:#e6c18d}h1{font-size:clamp(26px,7vw,37px);letter-spacing:3px;font-weight:normal;margin:14px 0 5px}.subtitle{font-size:13px;color:#cdb98f}.scene{position:relative;height:390px;max-width:330px;margin:20px auto 0}.envelope{position:absolute;left:50%;bottom:50px;transform:translateX(-50%);width:300px;height:195px;filter:drop-shadow(0 18px 20px #0009)}.back{position:absolute;inset:0;background:#394334;border:2px solid #ab8b58;border-radius:3px}.flap{position:absolute;inset:0;background:#536049;clip-path:polygon(0 0,100% 0,50% 67%);transform-origin:top center;transition:transform .85s ease;z-index:5}.front{position:absolute;inset:0;background:#48543f;clip-path:polygon(0 0,50% 57%,100% 0,100% 100%,0 100%);z-index:4;pointer-events:none}.front:after{content:'🦕  🍂  🦖';position:absolute;bottom:18px;left:0;right:0;font-size:25px;letter-spacing:14px}.seal{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);z-index:6;border:3px double #e0b57b;background:radial-gradient(circle at 30% 25%,#bf6551,#742f2d 75%);border-radius:50%;width:76px;height:76px;font-size:30px;color:#f6d7a3;box-shadow:0 5px 12px #0008;cursor:pointer}.paper{position:absolute;left:21px;bottom:14px;width:258px;height:167px;z-index:3;background:linear-gradient(140deg,#f5e5c1,#ddc497);border:5px double #a78857;box-shadow:0 0 12px #0006;padding:22px 10px;color:#4a392a;touch-action:none;user-select:none;cursor:grab;transition:transform .6s ease}.paper:active{cursor:grabbing}.paper strong{display:block;font-size:19px;letter-spacing:2px}.paper small{display:block;margin-top:16px;letter-spacing:2px}.envelope.open .flap{transform:rotateX(180deg);z-index:1}.envelope.open .seal{opacity:0;pointer-events:none}.envelope.pulled .paper{transform:translateY(-175px)}.hint{min-height:26px;letter-spacing:2px;font-size:12px;color:#e8c797}.letter{display:none;background:linear-gradient(135deg,#f4e4bd,#e0c594);border:8px double #9d7948;box-shadow:0 18px 45px #000a;color:#3b2b1f;padding:30px 20px 38px;margin:22px auto;animation:unfold 1s ease both;position:relative;overflow:hidden}.letter.show{display:block}.decor{font-size:35px;letter-spacing:8px;margin:0 0 22px}.letter .names{font-size:clamp(27px,8vw,38px);line-height:1.25;margin:12px 0 24px}.letter .invited{font-size:21px;line-height:1.6;margin:0}.letter .place{font-size:clamp(25px,7vw,33px);line-height:1.25;margin:10px 0 18px;color:#693c2d}.letter .treat{font-size:22px;line-height:1.5;margin:0}.letter .bottom{margin-top:30px;font-size:38px;letter-spacing:8px}@keyframes unfold{from{opacity:0;transform:scaleY(.2) translateY(-60px)}to{opacity:1;transform:scaleY(1) translateY(0)}}@media(max-width:350px){.scene{transform:scale(.88)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body><main>
<div class="eyebrow">A VERY SPECIAL DELIVERY</div><h1>HALLOWEEN MAIL</h1><div class="subtitle">A little dinosaur magic, just for you</div>
<div class="scene"><div class="envelope" id="envelope"><div class="back"></div><div class="flap"></div><div class="paper" id="paper" tabindex="0" role="button" aria-label="Swipe up to pull out the invitation"><strong>FINLEY, OLIVIA<br>&amp; BRANDON</strong><small>🦖 SPECIAL DELIVERY 🦕</small></div><div class="front"></div><button class="seal" id="seal" aria-label="Open dinosaur wax seal">🦖</button></div></div>
<p class="hint" id="hint" aria-live="polite">TAP THE DINOSAUR SEAL</p>
<article class="letter" id="letter" aria-label="Halloween invitation"><div class="decor" aria-hidden="true">🦕 🎃 🦖</div><div class="names">Finley, Olivia &amp; Brandon</div><p class="invited">You are invited to</p><div class="place">Morgan's Halloween Layer</div><p class="treat">to receive a very special<br>Halloween treat!</p><div class="bottom" aria-hidden="true">🎃 🦴 🍬</div></article>
</main>
<script>
const env=document.getElementById('envelope'),seal=document.getElementById('seal'),paper=document.getElementById('paper'),letter=document.getElementById('letter'),hint=document.getElementById('hint');let opened=false,pulled=false,dragging=false,startY=0,offset=0;
seal.addEventListener('click',()=>{if(opened)return;opened=true;env.classList.add('open');hint.textContent='SWIPE THE LETTER UPWARD';});
function reveal(){if(!opened||pulled)return;pulled=true;dragging=false;paper.style.transition='transform .6s ease';paper.style.transform='';env.classList.add('pulled');hint.textContent='HAPPY HALLOWEEN!';setTimeout(()=>{letter.classList.add('show');letter.scrollIntoView({behavior:'smooth',block:'start'});},700)}
paper.addEventListener('pointerdown',e=>{if(!opened||pulled)return;dragging=true;startY=e.clientY;offset=0;paper.style.transition='none';paper.setPointerCapture(e.pointerId)});
paper.addEventListener('pointermove',e=>{if(!dragging)return;offset=Math.max(-180,Math.min(0,e.clientY-startY));paper.style.transform=`translateY(${offset}px)`});
paper.addEventListener('pointerup',()=>{if(!dragging)return;dragging=false;if(offset< -60)reveal();else{paper.style.transition='transform .3s';paper.style.transform='translateY(0)'}});
paper.addEventListener('pointercancel',()=>{if(!dragging)return;dragging=false;paper.style.transition='transform .3s';paper.style.transform='translateY(0)'});
paper.addEventListener('keydown',e=>{if(opened&&(e.key==='Enter'||e.key===' ')){e.preventDefault();reveal()}});
</script></body></html>
