</style></head><body><main><h1>A VERY SPECIAL HALLOWEEN DELIVERY</h1><div class="stage" id="stage" role="button" tabindex="0" aria-label="Open your Halloween invitation"><div class="panel envelope"></div><div class="panel letter"></div><button class="seal" id="seal" aria-label="Break the dinosaur wax seal"></button></div><p class="hint" id="hint">Tap the dinosaur wax seal, then swipe up to open your invitation! 🦖</p><div class="controls"><button class="action" id="toggle">Open invitation</button></div></main><script>
const stage=document.getElementById('stage'),hint=document.getElementById('hint'),toggle=document.getElementById('toggle');let open=false,start=null;
function setOpen(v){open=v;stage.classList.toggle('open',v);hint.textContent=v?'A very special Halloween treat awaits! 🎃':'Tap the dinosaur wax seal, then swipe up to open your invitation! 🦖';toggle.textContent=v?'Close envelope':'Open invitation';stage.setAttribute('aria-label',v?'Close Halloween invitation':'Open Halloween invitation')}
document.getElementById('seal').addEventListener('click',e=>{e.stopPropagation();setOpen(true)});toggle.addEventListener('click',()=>setOpen(!open));stage.addEventListener('click',()=>setOpen(!open));stage.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setOpen(!open)}});stage.addEventListener('touchstart',e=>{start=e.touches[0].clientY},{passive:true});stage.addEventListener('touchend',e=>{if(start===null)return;let delta=e.changedTouches[0].clientY-start;if(delta < -35)setOpen(true);if(delta>35)setOpen(false);start=null},{passive:true});
</script></body></html>
