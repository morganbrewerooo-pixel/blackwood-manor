const stage=document.getElementById('stage'),hint=document.getElementById('hint'),toggle=document.getElementById('toggle');let opened=false,start=null;function setOpen(v){opened=v;stage.classList.toggle('open',v);toggle.textContent=v?'Close envelope':'Open invitation';hint.textContent=v?'Your special Halloween invitation! 🎃':'Tap the dinosaur wax seal or swipe up to open! 🦖🎃';stage.setAttribute('aria-label',v?'Close Halloween invitation':'Open Halloween invitation')};document.getElementById('seal').addEventListener('click',e=>{e.stopPropagation();setOpen(true)});stage.addEventListener('click',()=>setOpen(!opened));toggle.addEventListener('click',()=>setOpen(!opened));stage.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setOpen(!opened)}});stage.addEventListener('touchstart',e=>{start=e.touches[0].clientY},{passive:true});stage.addEventListener('touchend',e=>{if(start===null)return;const d=e.changedTouches[0].clientY-start;if(d< -35)setOpen(true);else if(d>35)setOpen(false);start=null},{passive:true});
